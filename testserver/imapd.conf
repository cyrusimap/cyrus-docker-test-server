admins: admin
allowplaintext: yes
altnamespace: yes
auditlog: yes
caldav_allowattach: yes
caldav_create_attach: yes
caldav_realm: test
configdirectory: /var/imap/config
master_ready_file: /var/run/cyrus/ready
conversations_counted_flags: \Draft \Flagged
conversations_max_thread: 1000
conversations: yes
crossdomains: yes
debug: yes
defaultacl: admin lrswipkxtecdan
defaultdomain: {{DEFAULTDOMAIN}}
defaultpartition: default
defaultsearchtier: t1
delete_mode: delayed
expunge_mode: delayed
httpmodules: caldav carddav jmap
httpallowcompress: no
httpprettytelemetry: yes
imipnotifier: imip
improved_mboxlist_sort: yes
jmapaccess_url: http://localhost:{{HTTPPORT}}/jmap/
jmapauth_allowsasl: yes
jmap_max_calls_in_request: 256
jmap_max_size_request: 51200K
jmap_max_size_upload: 204800K
jmap_nonstandard_extensions: yes
# Reject JMAP calls with no accountId (RFC 8620); off by default in Cyrus
# so unvetted production clients keep working, on here so tests catch them.
jmap_require_accountid: yes
# Previews are set on append by testserver/annotator.pl (as Fastmail does);
# with jmap_preview_annot set, Cyrus reads only the annotation, so without the
# annotator every preview is empty.
jmap_preview_annot: /shared/vendor/messagingengine.com/preview
annotation_callout: /var/run/cyrus/annotator.sock
annotation_definitions: /srv/testserver/annotation_definitions
# Cyrus defaults this to 0m (no caching). A cache makes any write-then-query
# sequence return stale results for its lifetime, which for a test server
# looks exactly like flaky search or a slow index.
jmap_querycache_max_age: 0
# Keep EmailSubmission objects after sending. The default deletes them
# immediately, so EmailSubmission/get and /query can never see a submission
# that was just created, and neither method can be exercised.
jmapsubmission_deleteonsend: no

# Needed for the RFC 8621 hasAttachment FilterCondition: Email/query matches
# on the $HasAttachment keyword, which is only set when this is on, whereas
# Email/get computes hasAttachment from the message structure. With this off
# the two disagree -- get says true, query finds nothing.
jmap_set_has_attachment: yes
# this is buggy, turn it off
jmap_vacation: no
maxheaderlines: 4096
maxmessagesize: 209715200
maxquoted: 8388608
maxword: 8388608
partition-default: /var/imap/spool
reverseacls: yes
rfc3028_strict: no
sasl_mech_list: PLAIN LOGIN
sasl_pwcheck_method: saslauthd
sasl_saslauthd_path: /var/run/cyrus/saslauthd.sock
savedate: yes
search_engine: xapian
search_index_headers: no
search_batchsize: 512
search_fuzzy_always: yes
search_maxtime: 30
search_snippet_length: 160
search_normalisation_max: 20000
search_index_language: yes
servername: {{SERVERNAME}}
sievedir: /var/imap/sieve
smtp_backend: host
smtp_host: localhost:25
sync_log: yes
sync_log_channels: squatter
t1searchpartition-default: /var/imap/search
unixhierarchysep: yes
virtdomains: userid
sharedprefix: Other Folders
userprefix: Other Users
