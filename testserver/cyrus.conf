START {
    recover cmd="/usr/cyrus/bin/ctl_cyrusdb -r"
}
SERVICES {
    lmtp listen={{LMTPPORT}} cmd="lmtpd -a"
    http listen={{HTTPPORT}} cmd="httpd"
    pop3 listen={{POP3PORT}} cmd="pop3d"
    imap listen={{IMAPPORT}} cmd="imapd"
    sieve listen={{SIEVEPORT}} cmd="timsieved"
}

EVENTS {
  checkpoint cmd="ctl_cyrusdb -c" period=180
}

DAEMON {
  idled cmd="idled"
  # -n must name the channel from sync_log_channels in imapd.conf; without it
  # the rolling indexer reads the default sync log, which is not written when
  # channels are configured, so nothing is ever indexed.
  squatter cmd="squatter -R -p -n squatter"
  calalarmd cmd="calalarmd"
  fakesaslauthd cmd="/usr/cyrus/bin/fakesaslauthd -p /var/run/cyrus/saslauthd.sock"
  # sets the preview annotation on append (annotation_callout)
  annotator cmd="/usr/bin/perl /srv/testserver/annotator.pl"
}
